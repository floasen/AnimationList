services:
  api: 
    image: animationlist-api
    pull_policy: never
    container_name: animationlist-api
    build: 
      context: ./Backend
      dockerfile: Dockerfile
      target: final
    ports:
      - "5000:5000"
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: migrations 
    command: ["./efbundle", "--connection", "${ConnectionStrings}"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: animationlist-frontend
    pull_policy: never
    container_name: animationlist-frontend
    build: 
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      
  db:
    image: mysql:8.4
    container_name: animationdb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: Animations
      MYSQL_USER: demo
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
    - db_password
    - db_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --user=demo --password=$$(cat $${MYSQL_PASSWORD_FILE}) --execute='SHOW DATABASES;'"]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  db_password:
    file: ./Secrets/db_password.txt
  db_root_password:
    file: ./Secrets/db_root_password.txt
  connectionstrings:
    file: ./Secrets/connectionstrings.txt

volumes:
  mysql-data:
